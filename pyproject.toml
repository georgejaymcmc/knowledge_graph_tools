[project]
name = "knowledge_graph_tools"
version = "0.1.0"
requires-python = "~=3.14"
dependencies = [
    "python-dotenv",
    "neo4j",
    "click",
    "pygithub",
    "pandas",
]

[project.scripts]
kgtools = "codebase_kg.cli.cli:cli"

[dependency-groups]
dev = ["flake8"]

[tool.uv]
package = false
default-groups = "all"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.setuptools.packages.find]
where = ["src"]
